<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9fd">
  <meta name="description" content="Catat makanan, pantau makro, dan kelola target nutrisi harian dengan NutriMacro.">
  <title>NutriMacro — Kalkulator Gizi Harian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #faf9fd;
      --surface: #fff;
      --surface-soft: #f7f5fb;
      --surface-tint: #f3f0fa;
      --border: #eee9f5;
      --ink: #1e1b2e;
      --muted: #6f6a7d;
      --purple: #6c2bd9;
      --purple-dark: #4e1ba5;
      --purple-pale: #ede9fe;
      --amber: #f59e0b;
      --amber-pale: #fef3c7;
      --blue: #0ea5e9;
      --blue-pale: #e0f2fe;
      --rose: #f43f5e;
      --rose-pale: #ffe4e6;
      --danger: #b42318;
      --danger-pale: #fee4e2;
      --shadow: 0 4px 20px -2px rgba(108, 43, 217, .07);
      --shadow-raised: 0 16px 44px -14px rgba(30, 27, 46, .25);
      --radius: 16px;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-size: 14px; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(108, 43, 217, .35); outline-offset: 2px;
    }
    .icon { font-family: "Material Symbols Outlined"; font-weight: normal; font-style: normal; font-size: 20px; line-height: 1; display: inline-flex; white-space: nowrap; direction: ltr; font-feature-settings: "liga"; -webkit-font-feature-settings: "liga"; -webkit-font-smoothing: antialiased; }
    .topbar { position: sticky; z-index: 10; top: 0; background: rgba(255,255,255,.91); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
    .topbar-inner { max-width: 1240px; height: 68px; padding: 0 24px; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: inline-flex; align-items: center; gap: 9px; color: var(--purple); text-decoration: none; font-size: 20px; font-weight: 800; letter-spacing: -.6px; white-space: nowrap; }
    .brand-mark { width: 32px; height: 32px; border-radius: 11px; display: grid; place-items: center; color: white; background: linear-gradient(145deg, #8248ed, #5520b7); box-shadow: 0 5px 12px rgba(108,43,217,.23); }
    .nav { display: flex; gap: 5px; padding: 4px; border-radius: 999px; background: var(--surface-tint); }
    .nav button { border: 0; border-radius: 999px; background: transparent; color: var(--muted); padding: 9px 14px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .nav button.active { background: var(--purple); color: white; box-shadow: 0 2px 7px rgba(108,43,217,.18); }
    .top-date { color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; }
    .container { max-width: 1240px; padding: 26px 24px 50px; margin: auto; min-height: calc(100vh - 180px); }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: clamp(24px,3vw,32px); line-height: 1.2; letter-spacing: -.9px; }
    h2, h3, p { margin-top: 0; }
    .eyebrow { margin: 0 0 7px; color: var(--purple); font-size: 11px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
    .subheading { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
    .card-pad { padding: 20px; }
    .datebar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; padding: 12px 16px; }
    .date-controls { display: flex; align-items: center; gap: 10px; }
    .date-label { min-width: 200px; text-align: center; font-weight: 700; }
    .date-label small { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; font-weight: 600; }
    .date-arrow, .icon-button { border: 0; width: 42px; height: 42px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--purple); background: var(--surface-tint); }
    .date-arrow:hover, .icon-button:hover { background: var(--purple-pale); }
    .button { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border: 0; border-radius: 999px; font-weight: 700; text-decoration: none; transition: transform .15s, background .15s; }
    .button:active { transform: scale(.96); }
    .button-primary { background: var(--amber); color: #2b210e; box-shadow: 0 5px 14px rgba(245,158,11,.22); }
    .button-primary:hover { background: #e89505; }
    .button-purple { color: white; background: var(--purple); }
    .button-purple:hover { background: var(--purple-dark); }
    .button-soft { color: var(--purple); background: var(--surface-tint); }
    .button-soft:hover { background: var(--purple-pale); }
    .button-danger { color: var(--danger); background: var(--danger-pale); }
    .button-small { min-height: 36px; padding: 7px 12px; font-size: 12px; }
    .dashboard-top { display: grid; grid-template-columns: minmax(340px, 5fr) minmax(0, 7fr); gap: 16px; margin-bottom: 16px; }
    .calorie-card { padding: 21px; overflow: hidden; position: relative; }
    .card-title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .title-with-icon { display: flex; align-items: center; gap: 8px; }
    .title-with-icon .icon { color: var(--purple); }
    .card h2, .card h3 { margin-bottom: 0; }
    .section-title { font-size: 17px; font-weight: 700; letter-spacing: -.25px; }
    .balance { padding: 6px 10px; border-radius: 999px; color: #8a5800; background: var(--amber-pale); font-size: 10px; font-weight: 800; white-space: nowrap; }
    .balance.over { color: var(--danger); background: var(--danger-pale); }
    .calorie-body { display: flex; align-items: center; justify-content: space-around; gap: 18px; padding: 19px 0 14px; }
    .ring-wrap { width: 172px; height: 172px; position: relative; flex: 0 0 auto; }
    .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-bg, .ring-value { fill: none; stroke-width: 11; }
    .ring-bg { stroke: #f0ebf8; }
    .ring-value { stroke: var(--amber); stroke-linecap: round; transition: stroke-dashoffset .65s ease, stroke .3s; }
    .ring-value.over { stroke: #ef4444; }
    .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .ring-number { font-size: 28px; font-weight: 800; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
    .ring-caption { margin-top: 2px; color: var(--muted); font-size: 10px; }
    .calorie-stats { display: grid; gap: 8px; flex: 1; min-width: 140px; }
    .calorie-stat { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 10px; background: var(--surface-soft); }
    .stat-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--purple); }
    .stat-dot.amber { background: var(--amber); } .stat-dot.gray { background: #9a94a7; }
    .stat-label { color: var(--muted); font-size: 10px; }
    .stat-value { margin-top: 2px; font-weight: 700; font-size: 13px; }
    .calorie-foot { padding-top: 12px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 10px; align-items: center; color: var(--muted); font-size: 11px; }
    .text-button { padding: 0; color: var(--purple); background: transparent; border: 0; font-weight: 700; }
    .macro-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 14px; }
    .macro-card { min-height: 210px; padding: 17px 16px; display: flex; flex-direction: column; justify-content: space-between; }
    .macro-head { display: flex; align-items: center; justify-content: space-between; }
    .macro-tag { padding: 5px 8px; border-radius: 999px; font-size: 9px; font-weight: 800; letter-spacing: .04em; }
    .macro-tag.protein { color: var(--purple); background: var(--purple-pale); }
    .macro-tag.carb { color: #0369a1; background: var(--blue-pale); }
    .macro-tag.fat { color: #be123c; background: var(--rose-pale); }
    .macro-card .icon { color: var(--macro-color); }
    .macro-amount { margin: 17px 0 4px; font-size: 23px; font-weight: 800; letter-spacing: -.7px; font-variant-numeric: tabular-nums; }
    .macro-target { color: var(--muted); font-size: 12px; font-weight: 500; }
    .macro-note { min-height: 18px; color: var(--muted); font-size: 11px; }
    .progress-track { height: 8px; overflow: hidden; border-radius: 99px; background: #f0edf5; }
    .progress-value { height: 100%; width: 0; border-radius: inherit; background: var(--macro-color); transition: width .6s ease; }
    .macro-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 7px; color: var(--muted); font-size: 10px; }
    .macro-foot strong { color: var(--macro-color); }
    .dashboard-columns { display: grid; grid-template-columns: minmax(0, 8fr) minmax(285px, 4fr); gap: 16px; align-items: start; }
    .meal-list, .side-stack { display: grid; gap: 14px; }
    .meal-card { overflow: hidden; }
    .meal-header { min-height: 75px; padding: 13px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #f7f2ff; }
    .meal-leading { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .meal-symbol { width: 42px; height: 42px; flex: 0 0 auto; border-radius: 50%; display: grid; place-items: center; color: var(--purple); background: var(--purple-pale); }
    .meal-name-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .meal-name { font-size: 16px; font-weight: 700; }
    .meal-time { padding: 3px 7px; border-radius: 99px; color: var(--muted); background: white; font-size: 9px; font-weight: 700; }
    .meal-subtotal { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .meal-actions { display: flex; align-items: center; gap: 6px; }
    .meal-toggle { min-width: 42px; min-height: 42px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); }
    .meal-content { padding: 7px 15px 14px; }
    .meal-content.collapsed { display: none; }
    .food-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 5px; border-bottom: 1px solid #f3f0f7; }
    .food-main { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
    .food-bullet { width: 8px; height: 8px; margin-top: 6px; flex: 0 0 auto; border-radius: 50%; background: var(--purple); }
    .food-name { font-size: 12px; font-weight: 700; overflow-wrap: anywhere; }
    .food-portion { margin-top: 4px; color: var(--muted); font-size: 10px; }
    .food-values { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 5px; }
    .chip { padding: 4px 7px; border-radius: 5px; font-size: 9px; font-weight: 700; white-space: nowrap; }
    .chip.cal { color: #92400e; background: var(--amber-pale); }
    .chip.pro { color: var(--purple); background: var(--purple-pale); }
    .chip.carb { color: #0369a1; background: var(--blue-pale); }
    .chip.fat { color: #be123c; background: var(--rose-pale); }
    .row-actions { display: flex; align-items: center; gap: 3px; opacity: .25; transition: opacity .15s; }
    .food-row:hover .row-actions, .row-actions:focus-within { opacity: 1; }
    .row-actions button { width: 34px; height: 34px; border: 0; border-radius: 50%; display: grid; place-items: center; color: var(--muted); background: transparent; }
    .row-actions button:hover { color: var(--purple); background: var(--purple-pale); }
    .row-actions button.delete:hover { color: var(--danger); background: var(--danger-pale); }
    .empty-state { padding: 24px 12px; text-align: center; color: var(--muted); }
    .empty-state .icon { display: block; margin: 0 auto 8px; color: #9991a7; font-size: 27px; }
    .empty-state strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 12px; }
    .add-meal { width: 100%; margin-top: 10px; }
    .water-summary { display: flex; align-items: center; justify-content: space-between; margin: 15px 0; }
    .water-big { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .water-small { color: var(--muted); font-size: 11px; }
    .water-grid { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 7px; margin-bottom: 13px; }
    .water-cup { min-height: 58px; padding: 6px 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; border-radius: 10px; color: #867e92; background: var(--surface-soft); }
    .water-cup.filled { color: var(--purple); background: var(--purple-pale); }
    .water-cup small { font-size: 9px; font-weight: 700; }
    .water-meter { width: 54px; height: 54px; position: relative; flex: 0 0 auto; }
    .water-meter svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .water-meter circle { fill: none; stroke-width: 5; }
    .water-meter .track { stroke: #f0ebf8; }
    .water-meter .value { stroke: var(--purple); stroke-linecap: round; transition: stroke-dashoffset .5s; }
    .water-meter .icon { position: absolute; inset: 0; margin: auto; color: var(--purple); }
    .shortcut-list { display: grid; gap: 7px; margin-top: 13px; }
    .shortcut { width: 100%; min-height: 52px; padding: 9px 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; border: 0; border-radius: 10px; color: var(--ink); background: var(--surface-soft); }
    .shortcut:hover { background: var(--purple-pale); }
    .shortcut b { display: block; font-size: 11px; }
    .shortcut small { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .shortcut .icon { color: var(--purple); }
    .tip-card { padding: 17px; border: 1px solid #e4d9fb; border-radius: var(--radius); background: linear-gradient(140deg,#efe8ff,#faf8ff); }
    .tip-card p { margin: 7px 0 0; color: #59536a; font-size: 11px; line-height: 1.65; }
    .disclaimer { margin: 22px 0 0; color: var(--muted); text-align: center; font-size: 10px; line-height: 1.6; }
    .page-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; align-items: start; gap: 18px; }
    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
    .field { display: grid; gap: 6px; }
    .field label { color: var(--ink); font-size: 12px; font-weight: 700; }
    .field small, .help { color: var(--muted); font-size: 10px; line-height: 1.5; }
    .field input, .field select, .search-input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; color: var(--ink); background: var(--surface-soft); }
    .field input:focus, .field select:focus, .search-input:focus { border-color: var(--purple); outline: 3px solid rgba(108,43,217,.12); }
    .form-section-title { margin: 0 0 14px; font-size: 15px; }
    .form-divider { margin: 20px 0; border: 0; border-top: 1px solid var(--border); }
    .manual-targets { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 10px; }
    .notice { padding: 12px 14px; border-radius: 10px; color: #744400; background: #fff7df; font-size: 11px; line-height: 1.6; }
    .notice.danger { color: #8c1d18; background: var(--danger-pale); }
    .formula-box { display: grid; gap: 12px; }
    .formula-line { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; }
    .formula-line strong { color: var(--ink); }
    .food-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .food-search-wrap { position: relative; flex: 1; max-width: 540px; }
    .food-search-wrap .icon { position: absolute; top: 12px; left: 12px; color: var(--muted); }
    .food-search-wrap input { padding-left: 42px; }
    .food-catalog { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
    .catalog-item { padding: 15px; }
    .catalog-item h3 { margin-bottom: 5px; font-size: 14px; }
    .catalog-meta { color: var(--muted); font-size: 10px; }
    .catalog-chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 11px 0; }
    .catalog-actions { display: flex; align-items: center; gap: 8px; }
    .catalog-actions .button { flex: 1; }
    .history-controls { display: flex; gap: 8px; }
    .segmented { padding: 4px; display: inline-flex; gap: 3px; border-radius: 999px; background: var(--surface-tint); }
    .segmented button { border: 0; border-radius: 999px; padding: 8px 14px; color: var(--muted); background: transparent; font-size: 11px; font-weight: 700; }
    .segmented button.active { color: #fff; background: var(--purple); }
    .history-stats { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 12px; margin-bottom: 16px; }
    .history-stat { padding: 16px; }
    .history-stat span { display: block; color: var(--muted); font-size: 10px; }
    .history-stat strong { display: block; margin-top: 6px; font-size: 20px; font-variant-numeric: tabular-nums; }
    .chart-card { margin-bottom: 16px; }
    .chart { min-height: 205px; padding: 22px 10px 0; display: flex; align-items: stretch; justify-content: space-around; gap: 8px; border-bottom: 1px solid var(--border); }
    .chart-day { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 7px; }
    .chart-bar-wrap { width: min(32px,75%); height: 145px; display: flex; align-items: flex-end; }
    .chart-bar { width: 100%; min-height: 3px; border-radius: 7px 7px 2px 2px; background: linear-gradient(180deg,#a78bfa,#6c2bd9); }
    .chart-value { color: var(--muted); font-size: 9px; text-align: center; }
    .chart-label { padding-bottom: 9px; color: var(--muted); font-size: 9px; }
    .history-row { display: grid; grid-template-columns: 1.2fr 1fr 1.3fr; gap: 10px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--border); }
    .history-row:last-child { border-bottom: 0; }
    .history-date { font-size: 11px; font-weight: 700; }
    .history-kcal { font-size: 11px; font-weight: 700; }
    .history-kcal small { color: var(--muted); font-weight: 500; }
    .history-macros { color: var(--muted); font-size: 10px; text-align: right; }
    .mobile-nav { display: none; }
    .footer { padding: 25px 20px 84px; text-align: center; color: var(--muted); font-size: 10px; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 30; padding: 20px; display: grid; place-items: center; background: rgba(30,27,46,.48); backdrop-filter: blur(4px); }
    .modal { width: min(100%,540px); max-height: min(92vh,760px); overflow: auto; border: 1px solid var(--border); border-radius: 22px; background: var(--surface); box-shadow: var(--shadow-raised); }
    .modal-header { padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; background: var(--surface-soft); }
    .modal-header h2 { margin: 0; font-size: 17px; }
    .modal-body { padding: 20px; display: grid; gap: 15px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; }
    .suggestions { max-height: 180px; overflow: auto; margin-top: 5px; border: 1px solid var(--border); border-radius: 9px; background: white; }
    .suggestion { width: 100%; padding: 10px 12px; display: flex; justify-content: space-between; gap: 12px; border: 0; border-bottom: 1px solid var(--border); color: var(--ink); text-align: left; background: white; font-size: 11px; }
    .suggestion:last-child { border-bottom: 0; }
    .suggestion:hover { background: var(--surface-soft); }
    .suggestion small { color: var(--muted); }
    .nutrition-preview { padding: 11px; border-radius: 9px; background: var(--surface-soft); }
    .nutrition-preview strong { font-size: 13px; }
    .preview-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .toast { position: fixed; z-index: 40; right: 20px; bottom: 20px; max-width: min(400px,calc(100vw - 32px)); padding: 13px 17px; border-radius: 12px; color: white; background: #302b3e; box-shadow: var(--shadow-raised); opacity: 0; transform: translateY(14px); pointer-events: none; transition: opacity .22s,transform .22s; font-size: 12px; }
    .toast.visible { opacity: 1; transform: translateY(0); }
    @media (max-width: 1000px) {
      .topbar-inner { gap: 12px; padding: 0 18px; }
      .nav button { padding: 9px 10px; }
      .top-date { display: none; }
      .dashboard-top { grid-template-columns: 1fr; }
      .calorie-body { justify-content: center; gap: 34px; }
      .macro-card { min-height: 190px; }
      .dashboard-columns { grid-template-columns: minmax(0, 1.6fr) minmax(265px, 1fr); }
    }
    @media (max-width: 760px) {
      body { padding-bottom: 67px; }
      .topbar-inner { height: 60px; padding: 0 15px; }
      .brand { font-size: 18px; }
      .brand-mark { width: 30px; height: 30px; }
      .nav { display: none; }
      .container { padding: 21px 14px 30px; }
      .page-heading { align-items: flex-start; flex-direction: column; }
      .datebar { flex-wrap: wrap; padding: 11px; }
      .date-controls { width: 100%; justify-content: space-between; }
      .date-label { min-width: 0; font-size: 12px; }
      .datebar > .button { width: 100%; }
      .calorie-card { padding: 17px; }
      .calorie-body { gap: 14px; }
      .ring-wrap { width: 145px; height: 145px; }
      .ring-number { font-size: 24px; }
      .calorie-stats { min-width: 0; }
      .calorie-stat { padding: 8px 7px; }
      .stat-value { font-size: 11px; }

      function calculateTargets(profile) {
        const weight=Number(profile.weight), height=Number(profile.height), age=Number(profile.age);
        const bmr=10*weight+6.25*height-5*age+(profile.sex==="pria"?5:-161);
        const tdee=bmr*Number(profile.activity);
        const adjustment=profile.goal==="lose" ? (profile.intensity==="moderate" ? -.2 : -.1) : profile.goal==="gain" ? (profile.intensity==="moderate" ? .1 : .05) : 0;
        const kcal=Math.max(profile.sex==="wanita"?1200:1500,Math.round(tdee*(1+adjustment)));
        const protein=Math.round(weight*(profile.goal==="maintain"?1.5:1.8));
        const fat=Math.round(kcal*.28/9);
        const carb=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));
        return { bmr, tdee, kcal, p:protein, c:carb, f:fat };
      }

      function exportCsv() {
        const entries=dayEntries();
        const rows=[["tanggal","waktu_makan","makanan","porsi_g","kalori_kcal","protein_g","karbohidrat_g","lemak_g"],...entries.map(entry=>[state.selectedDate,entry.meal,entry.name,entry.grams,entry.kcal,entry.p,entry.c,entry.f])];
        const csv=rows.map(row=>row.map(value=>`"${String(value).replace(/"/g,'""')}"`).join(",")).join("\r\n");
        const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
        const url=URL.createObjectURL(blob);
        const link=document.createElement("a");link.href=url;link.download=`nutrimacro-${state.selectedDate}.csv`;document.body.append(link);link.click();link.remove();URL.revokeObjectURL(url);
        showToast("Ringkasan CSV berhasil diunduh.");
      }
      function shiftDate(amount) {
        const date=new Date(state.selectedDate+"T12:00:00");date.setDate(date.getDate()+Number(amount));
        state.selectedDate=localDateString(date);saveState();render();
      }
      function resetProfile() {
        state.profile={sex:"pria",age:30,height:170,weight:70,activity:1.55,goal:"maintain",intensity:"light"};
        const calc=calculateTargets(state.profile);
        state.targets={...state.targets,kcal:calc.kcal,p:calc.p,c:calc.c,f:calc.f};
        saveState();render();showToast("Profil contoh diterapkan.");
      }
      document.addEventListener("click", event => {
        const pageButton=event.target.closest("[data-page]");
        if(pageButton){state.page=pageButton.dataset.page;render();return;}
        const link=event.target.closest("[data-page-link]");
        if(link){event.preventDefault();state.page=link.dataset.pageLink;render();return;}
        const target=event.target.closest("[data-action]");
        if(!target)return;
        const action=target.dataset.action;
        if(action==="date-shift")shiftDate(target.dataset.days);
        else if(action==="open-log")openLogModal(target.dataset.meal||state.currentMeal);
        else if(action==="toggle-meal"){const id=target.dataset.meal;state.collapsed[id]=!state.collapsed[id];render();}
        else if(action==="close-modal"){modalRoot.innerHTML="";modalState=null;}
        else if(action==="close-modal-backdrop" && event.target===target){modalRoot.innerHTML="";modalState=null;}
        else if(action==="select-food"){
          const food=foodById(target.dataset.food);if(!food)return;
          modalState.foodId=food.id;
          document.getElementById("selected-food-id").value=food.id;
          document.getElementById("food-search").value=food.name;
          document.getElementById("food-suggestions").style.display="none";
          updateLogPreview();
        }
        else if(action==="edit-entry")openLogModal(state.currentMeal,null,target.dataset.entry);
        else if(action==="delete-entry"){
          const entries=dayEntries();const index=entries.findIndex(entry=>entry.id===target.dataset.entry);
          if(index>=0){const [removed]=entries.splice(index,1);state.logs[state.selectedDate]=entries;saveState();render();showToast(`${removed.name} dihapus dari catatan.`);}
        }
        else if(action==="add-water"){
          state.water[state.selectedDate]=(Number(state.water[state.selectedDate])||0)+250;saveState();render();showToast("250 ml air berhasil dicatat.");
        }
        else if(action==="water-glass"){
          const index=Number(target.dataset.index);const current=Number(state.water[state.selectedDate])||0;
          state.water[state.selectedDate]=Math.max(0,index+1===Math.ceil(current/250)?index*250:(index+1)*250);
          saveState();render();showToast("Catatan hidrasi diperbarui.");
        }
        else if(action==="quick-favorite")openLogModal(state.currentMeal,target.dataset.food);
        else if(action==="favorite-food"){
          const food=foodById(target.dataset.food);if(food){food.favorite=!food.favorite;saveState();renderFoods(document.getElementById("catalog-search")?.value||"");showToast(food.favorite?"Ditambahkan ke favorit.":"Dihapus dari favorit.");}
        }
        else if(action==="toggle-custom-food"){
          const panel=document.getElementById("custom-food-panel");if(panel)panel.style.display=panel.style.display==="none"?"block":"none";
        }
        else if(action==="history-range"){state.historyDays=Number(target.dataset.days);render();}
        else if(action==="export-csv")exportCsv();
        else if(action==="save-targets")saveManualTargets();
        else if(action==="reset-profile")resetProfile();
        else if(action==="delete-food"){
          const food=foodById(target.dataset.food);
          if(food && food.custom && confirm(`Hapus "${food.name}" dari database? Catatan sebelumnya tetap tersimpan.`)){
            state.foods=state.foods.filter(item=>item.id!==food.id);saveState();renderFoods();showToast("Makanan kustom dihapus.");
          }
        }
      });
      document.addEventListener("input", event => {
        if(event.target.id==="food-search"){showSuggestions(event.target.value);}
        if(event.target.id==="log-grams"){updateLogPreview();}
        if(event.target.id==="catalog-search"){
          const position=event.target.selectionStart;renderFoods(event.target.value);
          const next=document.getElementById("catalog-search");next.focus();next.setSelectionRange(position,position);
        }
        if(event.target.id==="custom-kcal"||event.target.id==="custom-p"||event.target.id==="custom-c"||event.target.id==="custom-f")calculateCustomWarning();
        if(event.target.name==="kcal"){
          const limit=state.profile.sex==="wanita"?1200:1500;const warning=document.getElementById("safe-warning");
          if(warning)warning.style.display=Number(event.target.value)<limit?"block":"none";
        }
      });
      document.addEventListener("change", event => {
        if(event.target.id==="log-meal" && modalState){modalState.meal=event.target.value;state.currentMeal=event.target.value;}
      });
      document.addEventListener("submit", event => {
        if(event.target.id==="log-form"){
          event.preventDefault();
          const food=foodById(document.getElementById("selected-food-id").value);
          const grams=Number(document.getElementById("log-grams").value);
          if(!food){showToast("Pilih makanan dari hasil pencarian terlebih dahulu.");document.getElementById("food-search").focus();return;}
          if(!Number.isFinite(grams)||grams<=0){showToast("Masukkan porsi yang lebih besar dari 0 gram.");return;}
          const wasEdit=modalState.entryId;
          if(addEntry(document.getElementById("log-meal").value,food,grams,wasEdit)){modalRoot.innerHTML="";modalState=null;}
        } else if(event.target.id==="goal-form"){event.preventDefault();submitGoals(event.target);}
        else if(event.target.id==="custom-food-form"){event.preventDefault();addCustomFood(event.target);}
      });
      document.addEventListener("keydown", event => {
        if(event.key==="Escape" && modalState){modalRoot.innerHTML="";modalState=null;}
        if(event.key==="Enter" && event.target.id==="food-search"){
          const first=document.querySelector("#food-suggestions [data-food]");
          if(first){event.preventDefault();first.click();}
        }
      });
      if(!localStorage.getItem(STORAGE_KEY))saveState();
      render();
    })();
  </script>
</body>
</html>
